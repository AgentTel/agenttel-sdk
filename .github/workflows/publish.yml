name: Publish

on:
  release:
    types: [ published ]
  # Re-publish npm only, e.g. when the release run's npm job failed.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag (or commit) whose code is published to npm'
        required: true
        default: 'v0.4.0-alpha'

permissions:
  contents: read

jobs:
  publish-java:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build

      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSPHRASE }}

  # npm Trusted Publishing: npm authenticates this workflow via GitHub OIDC, so no
  # NPM_TOKEN secret is needed. Each package's npmjs.com settings must list
  # AgentTel/agenttel-sdk + publish.yml as its trusted publisher. Published versions
  # get provenance attestations automatically.
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@11 && npm --version

      # --tag latest is explicit: npm 11 requires a tag for prerelease versions.
      - name: Build and publish @agenttel/types
        working-directory: agenttel-types
        run: |
          npm ci
          npx tsc
          npm publish --access public --tag latest

      - name: Build and publish @agenttel/node
        working-directory: agenttel-node
        run: |
          npm ci
          npm publish --access public --tag latest   # prepack builds dist/ (ESM + CJS)

  publish-python:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine

      - name: Build and test
        working-directory: agenttel-python
        run: |
          pip install -e ".[dev]"
          pytest -v

      - name: Build distribution
        working-directory: agenttel-python
        run: python -m build

      - name: Publish to PyPI
        working-directory: agenttel-python
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
